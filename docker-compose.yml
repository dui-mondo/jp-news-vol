x-env: &env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  MARKET_DB_URL: postgresql+psycopg2://airflow:airflow@postgres:5432/market

x-airflow: &airflow
  build: .
  environment: *env
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dbt:/opt/airflow/dbt
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow
    command: bash -c "airflow db migrate && (airflow users create --username admin --password admin --firstname a --lastname b --role Admin --email a@b.c || true)"

  airflow-web:
    <<: *airflow
    command: airflow webserver
    ports: ["8080:8080"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dashboard:
    build: ./app
    environment: *env
    ports: ["8501:8501"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
